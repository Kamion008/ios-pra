name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: PRA
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      runner:
        description: macOS runner label (must have Xcode 15.x for xnu-8796)
        default: "macos-15"
  push:
    branches: [master, main, codex/a5xelte-bringup, s8-dreamlte]
    # Patch and workflow changes start a build. This bring-up targets PRA.
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  # A patch push and an explicit PRA dispatch for the same commit are both
  # useful: the push run validates the change and the dispatch selects the
  # PRA target. Do not have either run cancel the other (or a queued rerun).
  group: xnu-${{ github.run_id }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'PRA' }}

jobs:
  build:
    # macos-14 is not available to this account ("configuration
    # 'macos-14-arm64-us-xl' is not supported"), so the build runs on macos-15
    # and the Deps step selects the *lowest* installed Xcode. Xcode 15.x is
    # required: Xcode 16's iig emits IORPC.kernelContent, which xnu-8796 lacks.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          case "$MACHINE_CONFIG" in
          A5XELTE|PRA)
            # Cortex-A53 (Exynos7580 / hi6250 Kirin 655) is ARMv8.0: Xcode's
            # default arm64 code generation emits LSE atomics (ldadd/cas) that
            # trap as "Undefined kernel instruction". Same flags as
            # tools/a5xelte-build-firehose.sh.
            sed -i '' "s/ARCHS=\"x86_64 arm64e\" VALID_ARCHS=\"x86_64 arm64e\"/ARCHS=arm64 VALID_ARCHS=arm64 OTHER_CFLAGS='-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53 -march=armv8-a+crypto'/" dxb/build.sh
            grep -c "VALID_ARCHS=arm64 OTHER_CFLAGS='-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53" dxb/build.sh
            ;;
          *)
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
            grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
            ;;
          esac
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          # A previous PRA artifact did not contain the patched locore/cswitch
          # code even though the packaged source tree did. Force the kernel
          # objects and destination image to be rebuilt from the patched tree.
          rm -rf build/xnu.obj
          rm -f fakeroot/System/Library/Kernels/kernel.*
          bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Verify PRA preemption diagnostics are linked
        if: ${{ always() && env.MACHINE_CONFIG == 'PRA' }}
        run: |
          set -euo pipefail
          kernel=out/kernel.development.pra
          test -f "$kernel"
          # Avoid grep -q closing LLVM's output pipe early. With pipefail,
          # llvm-nm reports that expected early close as a broken-pipe error.
          xcrun llvm-nm -n "$kernel" | grep '_pra_preempt_notzero' >/dev/null
          strings -a "$kernel" | grep 'PRA-PREEMPT cnt=' >/dev/null
          xcrun llvm-objdump -d "$kernel" > /tmp/pra-kernel.disasm
          awk '/<return_to_user>:/ {inside=1} inside {print} inside && /<no_asts>:/ {exit}' /tmp/pra-kernel.disasm \
            | grep '_pra_preempt_notzero' >/dev/null
          echo 'PRA preemption diagnostic helper is linked and called from return_to_user.'
          # 0155 regression guard: build.sh SKIPS patches whose git apply
          # --check fails, so a half-regenerated patch can silently drop a
          # whole driver (the charger was missing from one kernel while CI
          # stayed green). Every PRA-only driver must assert its strings.
          strings -a "$kernel" | grep 'PRA charger:' >/dev/null
          strings -a "$kernel" | grep 'prai2c2' >/dev/null
          xcrun llvm-nm -n "$kernel" | grep '_pra_log_panic_flush' >/dev/null
          strings -a "$kernel" | grep 'PRA MSG' >/dev/null
          # 0164 guard: 0148/0162/0163 were silently skipped for weeks
          # (context drift; the phone flooded "card busy" on 0142's unfixed
          # CMD18) while CI stayed green. These strings exist only in the
          # 0164-consolidated eMMC driver - if the patch stops applying,
          # this fails LOUDLY instead of shipping a stale driver.
          strings -a "$kernel" | grep 'CMD18+CMD23 multi-block enabled' >/dev/null
          strings -a "$kernel" | grep 'CMD23 lba=' >/dev/null
          strings -a "$kernel" | grep 'busy-skip' >/dev/null
          strings -a "$kernel" | grep 'CMD18 ladder' >/dev/null
          # 0165 guard: the churn-block marker (grep -F: patterns contain
          # regex metacharacters).
          strings -a "$kernel" | grep -F 'praexecskip: blocked' >/dev/null
          # 0166-0170 guards: wedge-proof logging, recovery escalation,
          # emmctest telemetry, boot milestones, SDMA - one marker each.
          strings -a "$kernel" | grep -F 'PRA LOG: strat flush' >/dev/null
          strings -a "$kernel" | grep -F 'recover(c): card idle+reinit' >/dev/null
          strings -a "$kernel" | grep -F 'emmctest=1 probe chunks on' >/dev/null
          strings -a "$kernel" | grep -F '[+%3llu s]' >/dev/null
          strings -a "$kernel" | grep -F 'emmcdma=1 rejected' >/dev/null
          # 0171 GPU guard: ring24 measured Setup's main thread living in
          # MIL (Metal) - without this driver Metal never completes and
          # Setup never renders Hello.
          strings -a "$kernel" | grep -F 'Mali-T830 MP2' >/dev/null
          strings -a "$kernel" | grep -F 'PRAGPU: present: surface' >/dev/null
          strings -a "$kernel" | grep -F 'PRAGPU SELFTEST' >/dev/null
          # 0172 touch guard: read-only CYTT21403 probe behind pratouch=1
          # (i2c2 0xFFD73000, IRQ gpio224 = pl061 gpio28.0). ring24 had
          # Setup blocked in MIL; with 0171 landed, Setup/lock-screen are
          # the next wall and both need input - touch is next on the path
          # to Hello. 'pratouch' asserts the IOFindBSDRoot wiring; the
          # 'PRA touch:' strings are only in the driver itself.
          strings -a "$kernel" | grep -F 'PRA touch:' >/dev/null
          strings -a "$kernel" | grep -F 'PRA touch: HID desc' >/dev/null
          strings -a "$kernel" | grep -F 'pratouch' >/dev/null
          # 0173 sampler guard: the ring29 census (work/census29.md) showed
          # the stall is mach_msg2_trap (-47) + idle GCD workers, and 0 of 537
          # samples sat at mach_vm_deallocate (-12) - so the old vm_user probe
          # is dropped and the sampler now prints kernel-side per-thread state
          # (th/st/wait_event/waitq/continuation) plus a kernel fp backtrace
          # (kbt, only when the blocked stack was kept) to name the wait;
          # wq - offsetof(ipc_port, ip_waitq) names the port offline.
          strings -a "$kernel" | grep -F 'wq=0x%llx cont=0x%llx' >/dev/null
          # 0175 guard: the sampler records the block caller's fp/lr in
          # thread_block_reason (machine.ss's fp chain cannot cross the
          # context switch - ring32 walks ended at _thread_invoke) and walks
          # the pre-switch chain for stack-kept blocks, naming the wedged
          # VFS/journal site that UNINT-blocks launchd sync() and SpringBoard.
          strings -a "$kernel" | grep -F 'blr=0x%llx kbt' >/dev/null
          echo 'PRA charger, panic flush, Setup probe, 0164-0170 eMMC suite, 0165 churn fix, 0171 GPU, 0172 touch probe and 0173 sampler kernel state are linked.'

      - name: Check for ARMv8.1 LSE instructions (Cortex-A53 has none)
        if: always()
        run: |
          for k in out/kernel.*; do
            [ -f "$k" ] || continue
            case "$k" in *.link|*.dSYM) continue ;; esac
            xcrun llvm-objdump -d --no-show-raw-insn "$k" > "$k.disasm" 2>/dev/null || continue
            # function headers + LSE mnemonics, so each hit names its function
            grep -E '^[0-9a-f]+ <|	(cas|casa|casal|casl|casp|ldadd|ldclr|ldeor|ldset|ldsmax|ldsmin|ldumax|ldumin|stadd|stclr|steor|stset|stsmax|stsmin|stumax|stumin|swp)[a-z]*	' "$k.disasm" \
              | awk '/^[0-9a-f]+ </{fn=$2; next} {n++; c[fn]++} END {printf "LSE instructions: %d\n", n+0; for (f in c) print c[f], f}' \
              | sort -rn | head -40 | tee "$k.lse.txt"
            rm -f "$k.disasm"
          done

      # The Mach-O alone is 17 MB and zips to ~6.6 MB. Uploading all of out/
      # pulled in kernel.development.pra.link, a 135 MB build tree that zips
      # to ~55 MB, so every consumer downloaded ~62 MB to get one file.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: |
            out/kernel.development.pra
            out/kernel.development.pra.lse.txt
            out/SHA256SUMS
          if-no-files-found: warn

      # Only for debugging a failed link or building locally; tools/pra_ci.sh
      # downloads it only when PRA_BUILDTREE=1. buildtree.tgz additionally
      # carries the patched source tree (dxb/xnu) - the authoritative copy of
      # what this run compiled, for source audits without local replay.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: |
            out/kernel.development.pra.link
            out/kdk-libs
            buildtree.tgz
          if-no-files-found: ignore
          retention-days: 3
