name: zz-runners
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, macos-15, macos-latest, macos-14-arm64, macos-15-arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -a && sw_vers 2>/dev/null || true
